services:
  hotglue:
    build: .
    container_name: hotglue
    environment:
      PHP_DISPLAY_ERRORS: "1"
      PHP_POST_MAX_SIZE: "100M"
      PHP_UPLOAD_MAX_FILESIZE: "100M"
      PHP_SESSION_COOKIE_HTTPONLY: "1"
      UID: 1000
      GID: 1000
    ports:
      - 8082:80
    volumes:
      - ../:/var/www/html
    restart: unless-stopped
